<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Вхід до облікового запису GrammarFerret">
    <title>Вхід - GrammarFerret</title>
</head>
<body>
    <a href="#main-content">Перейти до основного вмісту</a>
    <header>
        <a href="index.html">
            <img src="images/site_embl.jpg" alt="На головну сторінку" width="34" height="34" aria-hidden="true">
            <span>GrammarFerret</span>
        </a>
        <nav aria-label="Основна навігація">
            <ul>
                <li><a href="index.html">Home</a></li>
            </ul>
        </nav>
    </header>

    <main id="main-content">
        <section aria-labelledby="login-title">
            <h1 id="login-title">Вхід до облікового запису</h1>
            <p>Будь ласка, введіть свої дані для входу в систему.</p>
            
            <!-- Форма входу -->
            <form action="/api/login" method="POST">
                <div>
                    <label for="login-email">Електронна пошта</label>
                    <input 
                        id="login-email" 
                        name="email" 
                        type="email" 
                        autocomplete="email" 
                        required
                    >
                </div>
                <div>
                    <label for="login-password">Пароль</label>
                    <input 
                        id="login-password" 
                        name="password" 
                        type="password" 
                        autocomplete="current-password" 
                        required
                    >
                </div>
                <div>
                    <button type="submit">Увійти</button>
                </div>
            </form>

            <p>Ще не маєте акаунта? <a href="register.html">Зареєструватися</a></p>
        </section>
    </main>

    <footer>
        <address>
            <ul>
                <li>
                    <img src="images/telegram.png" alt="телеграм канал" width="26" height="26" aria-hidden="true">
                    <a href="https://t.me/wingedsensitive" target="_blank" rel="noopener" aria-label="Перейти в Telegram акаунт @wingedsensitive">@wingedsensitive</a>
                </li>
                <li>
                    <img src="images/phone.png" alt="телефон" width="26" height="26" aria-hidden="true">
                    <a href="tel:+380639392820" aria-label="Зателефонувати за номером +380639392820">+380 (63) 939-28-20</a>
                </li>
                <li>
                    <img src="images/gmail.png" alt="пошта gmail" width="26" height="26" aria-hidden="true">
                    <a href="mailto:katiakate555@gmail.com" aria-label="Надіслати електронного листа на katiakate555@gmail.com">katiakate555@gmail.com</a>
                </li>
            </ul>
        </address>
    </footer>
</body>
</html>
