<!doctype html>
<html lang="uk">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Реєстрація нового акаунта GrammarFerret">
    <title>Реєстрація - GrammarFerret</title>
</head>

<body>
    <a href="#main-content">Перейти до основного вмісту</a>
    <header>
        <a href="index.html">
            <img src="images/site_embl.jpg" alt="На головну сторінку" width="34" height="34" aria-hidden="true">
            <span>GrammarFerret</span>
        </a>
        <nav aria-label="Основна навігація">
            <ul>
                <li><a href="index.html">Home</a></li>
            </ul>
        </nav>
    </header>

    <main id="main-content">
        <section aria-labelledby="register-title">
            <h1 id="register-title">Створення облікового запису</h1>
            <p>Заповніть форму, щоб розпочати навчання в GrammarFerret.</p>

            <form action="/api/register" method="POST">
                <!-- Відображуване ім'я -->
                <div>
                    <label for="register-name">Ім'я або нікнейм</label>
                    <input id="register-name" name="displayName" type="text" autocomplete="name" minlength="2"
                        maxlength="50" required>
                </div>

                <!-- Email -->
                <div>
                    <label for="register-email">Електронна пошта</label>
                    <input id="register-email" name="email" type="email" autocomplete="email" required>
                </div>

                <!-- Пароль -->
                <div>
                    <label for="register-password">Пароль</label>
                    <p id="password-hint">Пароль має містити щонайменше 8 символів.</p>
                    <input id="register-password" name="password" type="password" autocomplete="new-password"
                        minlength="8" aria-describedby="password-hint" required>
                </div>

                <!-- Підтвердження пароля -->
                <div>
                    <label for="register-password-confirm">Підтвердьте пароль</label>
                    <input id="register-password-confirm" name="passwordConfirm" type="password"
                        autocomplete="new-password" minlength="8" required>
                </div>

                <!-- Кнопка відправки -->
                <div>
                    <button type="submit">Зареєструватися</button>
                </div>
            </form>

            <p>Вже є акаунт? <a href="login.html">Увійти</a></p>
        </section>
    </main>

                        aria-label="Перейти в Telegram акаунт @wingedsensitive">@wingedsensitive</a>
                </li>
                <li>

                    <a href="tel:+380639392820" aria-label="Зателефонувати за номером +380639392820">+380 (63)
                        939-28-20</a>
                </li>
                <li>
                    <img src="images/gmail.png" alt="пошта gmail" width="26" height="26" aria-hidden="true">
                    <a href="mailto:katiakate555@gmail.com"
                        aria-label="Надіслати електронного листа на katiakate555@gmail.com">katiakate555@gmail.com</a>

</body>
